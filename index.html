const ck=()=>Object.keys(cats());
const tiles=fn=>'<div class="grid">'+ck().map((c,i)=>`<button class="tl" onclick="${fn}(${i})">${TI[c]||TI['My exercises']}<b>${esc(c)}</b></button>`).join('')+'</div>';
const exT=(c,fn,del)=>'<div class="grid">'+cats()[c].map(x=>`<div style="position:relative"><button class="tl" ${fn?`onclick="${fn}('${x.id}')"`:''}>${fig(x.p)}<b>${esc(x.n)}</b><span class="sm">${mu(x)}</span></button>${del&&x.c=='My exercises'?`<button style="position:absolute;top:4px;right:4px;min-height:40px" aria-label="Delete" onclick="dx('${x.id}')">🗑</button>`:''}</div>`).join('')+'</div>';

const sx=id=>{AXI=lib().find(e=>e.id==id);go('addx')};
function vAddX(){const x=AXI,t=x.t=='t',E=Array.isArray(x.e)&&x.e.length>1?x.e:null;return hd('Add exercise')+`<div class="c pb"><div class="r">${fig(x.p)}<b class="g">${esc(x.n)}<div class="sm">${mu(x)}</div></b></div>${E?`<label>Equipment<select id="xq">${E.map(q=>`<option>${q}</option>`).join('')}</select></label>`:''}${t?'<div class="r"><label class="g">Minutes<input id="xm" type="number" min="0" value="0"></label><label class="g">Seconds<input id="xs" type="number" min="0" max="59" value="30"></label></div>':'<label>Reps<input id="xv" type="number" min="0" value="10"></label><label>Weight (optional)<input id="xw" type="number" min="0" step="any"></label>'}</div><div class="r"><button class="p g" onclick="ad2()">Add</button><button class="g" onclick="go('pickc')">Cancel</button></div>`}
function ad2(){const x=AXI,t=x.t=='t',E=Array.isArray(x.e)&&x.e.length>1;B.items.push({id:x.id,n:x.n,t:x.t,p:x.p,q:E?$('xq').value:'',v:t?(+$('xm').value||0)*60+(+$('xs').value||0):+$('xv').value||0,w:$('xw')?$('xw').value:''});go('pickc')}
